    <!-- JSON-LD: FAQPage for AEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Fulcrum-India?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fulcrum-India is an operating system and guided orchestration layer for Indian micro and small enterprises. It helps entrepreneurs organize their business information, receive structured guidance, discover relevant government schemes, and track their journey in one place."
          }
        },
        {
          "@type": "Question",
          "name": "Who is Fulcrum for?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fulcrum is built for Indian entrepreneurs — including first-generation founders, micro-enterprises, and small businesses — whether starting a venture, expanding an existing business, or navigating government support programs."
          }
        },
        {
          "@type": "Question",
          "name": "What does a Guide do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Guide serves as an ongoing business mentor. Guides assist entrepreneurs with strategic business planning, milestone navigation, and scheme application preparation through the platform."
          }
        },
        {
          "@type": "Question",
          "name": "What does an SME do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A Subject Matter Expert (SME) provides specialist domain guidance in targeted areas where technical knowledge is critical, such as GST & taxation, FSSAI compliance, patents, licensing, and legal advisory."
          }
        },
        {
          "@type": "Question",
          "name": "How does Fulcrum help entrepreneurs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fulcrum brings together your business profile, mentorship from Guides, specialist SME support, relevant scheme discovery, and a chronological journey timeline into a single connected platform."
          }
        },
        {
          "@type": "Question",
          "name": "How does scheme matching work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Fulcrum uses deterministic evaluation matching an entrepreneur's specific profile factors against official scheme parameters to highlight Recommended schemes (high relevance) and Potentially Eligible schemes (partial match requiring review)."
          }
        },
        {
          "@type": "Question",
          "name": "What information is considered for scheme relevance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Scheme evaluation considers geographic location (state and district), industry sector (e.g., food processing, manufacturing, agriculture), enterprise stage (seed, early, growth), demographic factors, and investment/capital requirements."
          }
        },
        {
          "@type": "Question",
          "name": "Does Fulcrum guarantee scheme eligibility?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Fulcrum surfaces schemes based on profile relevance for informational purposes. Final eligibility criteria and formal determinations are made solely by the respective government ministries, nodal agencies, or implementing bodies."
          }
        },
        {
          "@type": "Question",
          "name": "Does Fulcrum guarantee funding?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Fulcrum does not provide or guarantee loans, subsidies, or grants. Credit underwriting and financial disbursement decisions rest exclusively with designated lending institutions, banks, and scheme authorities."
          }
        },
        {
          "@type": "Question",
          "name": "Is Fulcrum a bank?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Fulcrum-India is a technology orchestration platform, not a bank, non-banking financial company (NBFC), or financial institution. It does not disburse funds or make credit decisions."
          }
        },
        {
          "@type": "Question",
          "name": "How does an entrepreneur get started?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Entrepreneurs can get started by accessing the production platform at app.fulcrumindia.online to create their profile and begin their journey."
          }
        }
      ]
    }
